name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8-0'
          environment-file: build-environment.yml
          cache-environment: true

      - name: Build the tvb-gdist wasm package
        shell: bash -l {0}
        run: |
          rattler-build build \
            --recipe wasm-tests/recipes/tvb-gdist \
            --target-platform emscripten-wasm32 \
            --test skip \
            --output-dir "$GITHUB_WORKSPACE/local-channel" \
            -c https://repo.prefix.dev/emscripten-forge-4x \
            -c https://repo.prefix.dev/emscripten-forge-dev \
            -c https://repo.prefix.dev/conda-forge \
            -c microsoft \
            -m wasm-tests/recipes/variant.yaml

      - name: Add tvb-gdist to the kernel environment
        shell: bash -l {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          lines = Path("environment.yml").read_text().splitlines()
          out = []
          for line in lines:
              out.append(line)
              if line.strip() == "channels:":
                  out.append(f"  - file://{root}/local-channel")
          lines, out = out, []
          for line in lines:
              out.append(line)
              if line.strip() == "dependencies:":
                  out.append("  - tvb-gdist")
          Path("environment.ci.yml").write_text("\n".join(out) + "\n")
          PY

      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist \
            --XeusAddon.environment_file=environment.ci.yml
          cp -rv dist/extensions/catppuccin_jupyterlab/themes/catppuccin_jupyterlab dist/build/themes/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
