name: xeus-kernel
channels:
  # NOTE: emscripten-forge-4x MUST come before emscripten-forge-dev.
  # numba/llvmlite only exist on 4x (emscripten-abi 4.x), while dev is the
  # emscripten 3.1.73 channel -- dev-first would silently mix both ABIs and
  # hand us a broken kernel env (solver happily picks python from 4x and
  # matplotlib from dev).
  - https://repo.prefix.dev/emscripten-forge-4x
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python
  - numpy
  - scipy
  - matplotlib
  - autograd
  - tqdm
  - scikit-learn
  - ipywidgets
  - joblib
  - setuptools
  - jupyterlite-terminal
  - pandas
  - numba
  - networkx
  - numexpr
  - mako
  - deprecated
  - docutils
  - autopep8
  - six
  - h5py
  - pip
  - pip:
    - mne
    - ebrains-drive
    - pyunicore
    - tslearn
    - catppuccin-jupyterlab
    - corner
    - pooch
    # tvb-library is pure Python.  Use the fork with the numba/hybrid
    # backends (PyPI's 2.10 release predates them).  When building locally
    # from a sibling checkout you can replace this with:
    #   - ../tvb/tvb_library
    - "tvb-library @ git+https://github.com/maedoc/tvb.git#subdirectory=tvb_library"
    - tvb-data
