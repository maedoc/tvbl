name: xeus-kernel
channels:
  # NOTE: emscripten-forge-4x MUST come before emscripten-forge-dev.
  # numba/llvmlite only exist on 4x (emscripten-abi 4.x), while dev is the
  # emscripten 3.1.73 channel -- dev-first would silently mix both ABIs and
  # hand us a broken kernel env (solver happily picks python from 4x and
  # matplotlib from dev).
  - https://repo.prefix.dev/emscripten-forge-4x
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python
  - numpy
  - scipy
  - matplotlib
  - autograd
  - tqdm
  - scikit-learn
  - ipywidgets
  - joblib
  - setuptools
  - jupyterlite-terminal
  - pandas
  - numba
  - networkx
  - numexpr
  - mako
  - deprecated
  - docutils
  - autopep8
  - six
  - h5py
  - pip
  - pip:
    - mne
    - ebrains-drive
    - pyunicore
    - tslearn
    - catppuccin-jupyterlab
    - corner
    - pooch
    # tvb-library is pure Python but PyPI's latest release (2.10.0) predates
    # the numba/hybrid backends.  Install it from the monorepo instead; pip
    # supports a git ref (branch, tag or commit) plus a subdirectory.
    # Pin the ref to a commit for reproducible deploys, e.g.
    #   git ls-remote https://github.com/the-virtual-brain/tvb-root.git refs/heads/master
    # and append @<sha> before the "#".
    - "tvb-library @ git+https://github.com/the-virtual-brain/tvb-root.git@master#subdirectory=tvb_library"
    - tvb-data
